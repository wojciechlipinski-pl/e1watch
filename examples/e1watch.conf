# e1watch configuration. Search order: -c FILE, $E1WATCH_CONF, /etc/e1watch.conf, ~/.config/e1watch.ini

[ami]
# Asterisk Manager Interface user with `read = system,reporting` and `write = system,reporting`
# (CoreShowChannels needs write permission). Bind AMI to 127.0.0.1.
host = 127.0.0.1
port = 5038
user = e1watch
# Prefer secret_file (chmod 600) over secret.
secret_file = /etc/e1watch.secret

[e1watch]
lang = en                  ; en | pl
mask = yes                 ; mask the middle digits of numbers longer than 6 digits
# Direction: the DAHDI leg that started the call (Uniqueid == Linkedid) is inbound. Optional fallback by dialplan context:
# inbound_contexts = from-pstn, from-e1
# Used only as a fallback when AMI gives no Uniqueid/Linkedid; Linkedid always wins (an outbound DAHDI leg shares the channel's default context).
# Regex matched against /proc/interrupts to show the card interrupt rate.
# irq_pattern = dahdi|wct|tor3|t[24]xxp
# Optional file with `free` or `sync` (written by your own clock-watch script).
# clock_state_file = /run/e1watch-clock.state

# spans = 1,4              ; show only these spans (default: all detected)

# Spans and B-channels are autodetected from /proc/dahdi. Override name/channels per span:
# [span.1]
# name = Carrier PRI
# channels = 1-15,17-31
